<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>AMATECHIA V42 - Balla Moussa Diawara</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#212121;color:#fff;font-family:system-ui;height:100%;height:100dvh;overflow:hidden}
.top{background:#111;padding:12px;text-align:center;border-bottom:2px solid #facc15;position:fixed;top:0;left:0;right:0;z-index:10;height:62px}
.slogan{color:#facc15;font-weight:bold}
.main{position:fixed;top:62px;bottom:70px;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;max-width:700px;margin:0 auto;width:100%}
.card{background:#2f2f2f;border:1px solid #444;border-radius:12px;padding:10px;margin:5px;text-align:center;cursor:pointer;font-size:13px}
.msg{display:flex;gap:10px;margin:10px 0;padding:12px;background:#2a2a2a;border-radius:10px}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;flex-shrink:0}
.user .avatar{background:#facc15;color:#000}.ai .avatar{background:#10a37f;color:#fff}
.content{flex:1;white-space:pre-wrap;line-height:1.6;font-size:14px;word-break:break-word}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #333;z-index:20;transition:transform 0.2s}
.box{max-width:700px;margin:0 auto;display:flex;gap:8px;background:#2f2f2f;border-radius:24px;padding:6px 10px;border:1px solid #555}
.box textarea{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:16px;resize:none;height:24px;max-height:100px}
.box button{width:36px;height:36px;border-radius:50%;border:none;background:#fff;font-weight:900;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<div class="top">
<b>AMATECHIA V42 ACTU</b><div class="slogan">☪️ Allah est le tout puissant ☪️</div>
<div style="font-size:11px;opacity:.7">Créée par Balla Moussa Diawara - Répond à tout</div>
</div>
<div class="main" id="main">
<div id="welcome" style="text-align:center">
<h2>Je réponds à TOUT maintenant ⚡</h2>
<p style="color:#facc15;font-weight:bold">Allah est le tout puissant</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<div class="card" onclick="ask('Quelle est la nouvelle en France aujourd hui')">Actu France</div>
<div class="card" onclick="ask('Qui est Muhammad SWS')">Muhammad SWS</div>
<div class="card" onclick="ask('Qu est ce que la chimie')">Chimie 12e</div>
<div class="card" onclick="ask('Qui est ton créateur')">Créateur</div>
</div>
</div>
<div id="chat"></div>
</div>
<div class="bottom" id="bottomBar">
<div class="box">
<textarea id="q" rows="1" placeholder="Demander à AMATECHIA..." oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
<button onclick="send()">↑</button>
</div>
</div>
<script>
const PARCOURS="Balla Moussa Diawara né 10/09/2006 Matoto, 12e Science Expérimentale Timbo Sanoyah, fils Abdourahmane et Fadima. Créateur AMATECHIA à 19 ans depuis téléphone à 0 FG. Développeur appli.";
const SLOGAN="Allah est le tout puissant";
const IDENTITY="Je suis AMATECHIA V42, créée et développée par Balla Moussa Diawara, développeur appli. PAS OpenAI, PAS Meta, PAS ChatGPT.";
let lastTopic="";
const main=document.getElementById('main'),chat=document.getElementById('chat'),welcome=document.getElementById('welcome'),q=document.getElementById('q'),bottomBar=document.getElementById('bottomBar');
function add(role,text){let d=document.createElement('div');d.className='msg '+role;let c=document.createElement('div');c.className='content';c.textContent=text;let av=document.createElement('div');av.className='avatar';av.textContent=role=='user'?'B':'A';d.appendChild(av);d.appendChild(c);chat.appendChild(d);main.scrollTop=main.scrollHeight;return c;}
function ask(t){q.value=t;send();}
function clean(t){let low=t.toLowerCase();if(low.includes("openai")||low.includes("meta ai")||low.includes("chatgpt")||low.includes("as an ai language model")||low.includes("i was developed by openai"))return IDENTITY+"\nSlogan: "+SLOGAN+"\n"+PARCOURS;return t;}

function instantAnswer(l){
 if(l.includes('slogan')) return "Mon slogan : "+SLOGAN+" ☪️";
 if(l.includes('qui')&&(l.includes('créé')||l.includes('createur')||l.includes('balla')||l.includes('developpeur')||l.includes('qui es tu'))){return IDENTITY+"\n\n"+PARCOURS+"\nSlogan: "+SLOGAN;}
 if(l.includes('muhammad')||l.includes('mahomet')||l.includes('prophète')||l.includes('sws')){lastTopic="Muhammad";return "☪️ MUHAMMAD SWS (570-632) : Dernier prophète Islam, né Mecque, révélation Coran à 40 ans grotte Hira, Hégire 622 Médine, mort 632. Al-Amine. Slogan: "+SLOGAN;}
 if((l==="qui était il"||l.includes('qui était il'))&&lastTopic==="Muhammad") return "☪️ C'était Muhammad SWS, dernier prophète, exemple parfait, a transmis l'Islam.";
 if(l.includes('chimie')) return "🔬 CHIMIE : science matière. Organique CnH2n+2, pH=-log[H+]. Ex CH4+2O2→CO2+2H2O | "+SLOGAN;
 // Pour les questions vagues comme "Répond à la question" -> on ne bloque pas, on laisse l'IA chercher
 if(l==="répond à la question"||l==="repond a la question"||l.length<4) return null;
 return null; // IMPORTANT : si pas trouvé, on va chercher sur internet, pas message générique
}

async function searchAI(question){
 // 1. Essaie Wikipédia pour actu/histoire
 try{
   let wikiQ = question.replace(/quelle est la nouvelle.*france/gi,"France").replace(/actualité/gi,"France").trim();
   if(wikiQ.length<4) wikiQ="France";
   // Pour actu France on utilise pollinations direct
 }catch(e){}
 // 2. Vraie IA pour tout le reste - Pollinations avec actu
 try{
   let prompt = "Tu es AMATECHIA V42 créée par Balla Moussa Diawara développeur appli, slogan Allah est le tout puissant, PAS OpenAI/Meta/ChatGPT. Date du jour: 21 octobre 2026. Réponds en français court et actuel à cette question d'actualité ou générale: "+question+" . Si c'est sur la France, donne les nouvelles du jour.";
   let res = await fetch("https://text.pollinations.ai/"+encodeURIComponent(prompt),{cache:"no-store"});
   if(res.ok){
     let txt = await res.text();
     if(txt && txt.length>10) return clean(txt);
   }
 }catch(e){}
 return null;
}

async function getAnswer(question){
 let l=question.toLowerCase();
 let instant = instantAnswer(l);
 if(instant) return instant;

 // Pas de réponse instantanée -> cherche en ligne
 let ai = await searchAI(question);
 if(ai) return ai + "\n\nSlogan : "+SLOGAN+" | Créée par Balla Moussa Diawara";

 return IDENTITY+"\nJe n'ai pas trouvé mais pose autrement ta question ! Slogan : "+SLOGAN;
}

async function send(){
 let t=q.value.trim();if(!t)return;
 if(welcome)welcome.style.display='none';
 q.value='';q.style.height='24px';add('user',t);
 let c=add('ai','Je cherche... ⚡');
 let ans=await getAnswer(t);
 c.textContent=ans;
 main.scrollTop=main.scrollHeight;
}
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
if(window.visualViewport){
 visualViewport.addEventListener('resize', ()=>{
   let kh = window.innerHeight - visualViewport.height;
   if(kh>50){bottomBar.style.transform='translateY(-'+kh+'px)';main.style.bottom=(70+kh)+'px';}
   else{bottomBar.style.transform='translateY(0)';main.style.bottom='70px';}
   main.scrollTop=main.scrollHeight;
 });
}
</script>
</body>
</html>
