 q=q.toLowerCase();

 if(q.includes("balla")||q.includes("diawara")||q.includes("qui es tu")) return "Je suis AMATECHIA BALLA, créée le 19 Oct 2026 à Km36 par Balla Moussa Diawara, 613754349 ! Je suis la première IA 100% Guinéenne, faite à Conakry. Mon créateur veut montrer que la Guinée aussi peut créer l'Intelligence Artificielle ! 🇬🇳";
 if(q.includes("bonsoir")||q.includes("bonjour")||q.includes("salut")) return "Bonsoir Balla ! 🇬🇳 Content de te voir ! Comment je peux t'aider aujourd'hui ? Pose-moi une question sur la Guinée, la latérite, la bauxite !";
 return "Bonne question : \""+q+"\" ! Je suis AMATECHIA BALLA, née le 19 Oct 2026 à Km36. Je suis encore jeune, j'apprends ! Pour l'instant je connais bien la latérite, la bauxite, Conakry, et mon créateur Balla Moussa Diawara. Pose-moi une question là-dessus ! 🇬🇳";
}
