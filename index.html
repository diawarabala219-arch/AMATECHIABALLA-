<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMATECHIA V16</title>
<style>body{background:#000;color:#fff;font-family:system-ui;padding:10px}button{width:100%;padding:18px;border:none;border-radius:12px;font-weight:900;margin:8px 0;font-size:16px} .y{background:#facc15;color:#000} .b{background:#0ea5e9;color:#fff} canvas{background:#fff;border-radius:10px;width:100%;margin-top:10px} .top{text-align:center;border-bottom:2px solid #facc15;padding:10px}</style>
</head><body>
<div class="top"><h2>✅ AMATECHIA V16 PRO - 0 GNF</h2><p style="font-size:11px;color:#aaa">Plans HD comme tes exemples - Balla Kagbelen</p></div>
<button class="y" onclick="plan()">📐 PLAN 7.5x6.5 HD - CLIQUE ICI</button>
<button class="b" onclick="facade()">🏠 FAÇADE TOIT ROUGE MARBRE NOIR</button>
<div id="r" style="margin-top:15px"></div>
<script>
function plan(){
let h=`<h3>📐 PLAN RDC 7.5x6.5 - 48.8m² - Villa Kagbelen</h3>
<p>✅ Chambre 3x3 lit double<br>✅ Salon 3.5x3.5 canapé L<br>✅ Cuisine 2.5x3<br>✅ Toilette 1.5x2<br>✅ Garage 2.9x5 voiture<br>✅ Véranda 1.5x6.5 plantes</p>
<canvas id="c" width="800" height="650"></canvas><br><button class="y" onclick="dl()">📥 Télécharger PNG Client</button>`;
document.getElementById('r').innerHTML=h;
let ctx=document.getElementById('c').getContext('2d');
ctx.fillStyle='#fff';ctx.fillRect(0,0,800,650);
ctx.fillStyle='#1e3a8a';ctx.fillRect(0,0,800,45);
ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('Plan RDC 7.5x6.5 - 48.8m² - Kagbelen',10,30);
ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.strokeRect(10,60,700,550);
ctx.fillStyle='#fef3c7';ctx.fillRect(10,60,250,250);ctx.strokeRect(10,60,250,250);ctx.fillStyle='#000';ctx.fillText('CHAMBRE 3x3',20,100);ctx.fillText('🛏️',80,180);
ctx.fillStyle='#fffbeb';ctx.fillRect(260,60,280,250);ctx.strokeRect(260,60,280,250);ctx.fillText('SALON 3.5x3.5',270,100);ctx.fillText('🛋️ 📺',330,180);
ctx.fillStyle='#dbeafe';ctx.fillRect(540,60,170,120);ctx.strokeRect(540,60,170,120);ctx.fillText('TOILETTE',550,100);
ctx.fillStyle='#f3f4f6';ctx.fillRect(540,180,170,130);ctx.strokeRect(540,180,170,130);ctx.fillText('CUISINE',550,220);
ctx.fillStyle='#f1f5f9';ctx.fillRect(10,310,350,300);ctx.strokeRect(10,310,350,300);ctx.fillText('GARAGE 2.9x5',20,340);ctx.fillStyle='#888';ctx.fillRect(80,380,200,150);ctx.fillStyle='#fff';ctx.font='40px Arial';ctx.fillText('🚗',150,470);
ctx.fillStyle='#e5e7eb';ctx.fillRect(360,310,350,100);ctx.strokeRect(360,310,350,100);ctx.fillStyle='#000';ctx.font='14px Arial';ctx.fillText('Véranda 1.5x6.5 🌿🌿',380,350);
}
function facade(){
let h=`<h3>🏠 FAÇADE TOIT ROUGE MARBRE NOIR - Villa Kagbelen</h3><canvas id="c2" width="800" height="500"></canvas><br><button class="b" onclick="dl2()">📥 Télécharger Façade</button>`;
document.getElementById('r').innerHTML=h;
let ctx=document.getElementById('c2').getContext('2d');
ctx.fillStyle='#87CEEB';ctx.fillRect(0,0,800,250);
ctx.fillStyle='#6b7280';ctx.fillRect(0,250,800,250);
ctx.fillStyle='#f5f5dc';ctx.fillRect(150,150,500,150);
ctx.fillStyle='#dc2626';ctx.beginPath();ctx.moveTo(130,150);ctx.lineTo(400,60);ctx.lineTo(670,150);ctx.fill();
ctx.fillStyle='#111827';ctx.fillRect(250,150,35,150);ctx.fillRect(500,150,35,150);
ctx.fillStyle='#1f2937';ctx.fillRect(320,180,160,120);
ctx.fillStyle='#000';ctx.font='bold 16px Arial';ctx.fillText('Villa Kagbelen - Toit rouge - Marbre noir',150,30);
}
function dl(){let a=document.createElement('a');a.download='Plan-7.5x6.5-HD.png';a.href=document.getElementById('c').toDataURL();a.click();}
function dl2(){let a=document.createElement('a');a.download='Facade-Toit-Rouge.png';a.href=document.getElementById('c2').toDataURL();a.click();}
</script></body></html>
