<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMATECHIA BALLA</title><style>body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial;display:flex;flex-direction:column;height:100vh}.header{background:#1a1a1a;padding:12px;display:flex;gap:10px;border-bottom:1px solid #333}.logo{width:45px;height:45px;background:linear-gradient(135deg,#f9d949,#3ec70b,#f00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#000}.header-text h1{font-size:16px}.header-text p{font-size:11px;color:#00ff88}.date-creation{font-size:10px;color:#aaa;margin-top:2px}.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}.msg{background:#222;padding:12px;border-radius:15px;max-width:85%;font-size:14px}.input-area{background:#1a1a1a;padding:10px;display:flex;gap:8px;border-top:1px solid #333;position:sticky;bottom:0}.input-area input{flex:1;background:#2a2a2a;border:1px solid #444;color:#fff;padding:12px;border-radius:25px;outline:none}.input-area button{background:#00c853;color:#fff;border:none;padding:0 18px;border-radius:25px;font-weight:bold}</style></head><body><div class="header"><div class="logo">AB</div><div class="header-text"><h1>AMATECHIA BALLA</h1><p>Par Balla Moussa Diawara • Conakry 🇬🇳 • 613754349</p><div class="date-creation">Créée le 19 Oct 2026 - Km36 🇬🇳</div></div></div><div class="chat" id="chat"><div class="msg">Salut ! Je suis AMATECH IA BALLA 🇬🇳<br><br>Créée par <b>Balla Moussa Diawara</b>, première IA Guinéenne à Conakry, le 19 Oct 2026.</div></div><div class="input-area"><input id="userInput" placeholder="Question pour Balla Moussa..."><button onclick="sendMsg()">Envoyer</button></div><script>function sendMsg(){let i=document.getElementById('userInput');let t=i.value.trim();if(!t)return;let c=document.getElementById('chat');c.innerHTML+=`<div class="msg" style="align-self:flex-end;background:#00c853">${t}</div>`;i.value='';setTimeout(()=>{c.innerHTML+=`<div class="msg">Merci : "${t}" ! Je suis AMATECHIA BALLA, créée le 19 Oct 2026 par Balla Moussa Diawara 🇬🇳</div>`;c.scrollTop=c.scrollHeight;},500);c.scrollTop=c.scrollHeight;}document.getElementById('userInput').addEventListener('keypress',function(e){if(e.key==='Enter')sendMsg();});</script></body></html>
