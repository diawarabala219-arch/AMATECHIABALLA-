<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMATECHIA</title>
<style>
body{font-family:Arial;padding:15px;background:#f5f5f5}
.card{background:white;padding:15px;border-radius:10px;margin-bottom:10px}
button{background:#2196F3;color:white;border:none;padding:10px 15px;border-radius:5px;margin:3px}
textarea,input{width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;box-sizing:border-box}
</style>
</head>
<body>
<h2>AMATECHIA - Corrigé</h2>

<div class="card">
<textarea id="questionInput" placeholder="Écris ta question..."></textarea>
<button onclick="ajouterQuestion()">Ajouter</button>
<button onclick="effacerTout()" style="background:#f44336">Effacer Tout</button>
</div>

<div class="card">
<h3>Questions (<span id="count">0</span>)</h3>
<div id="listeQuestions"></div>
</div>

<div class="card">
<textarea id="texteALire" placeholder="Texte à lire..."></textarea>
<button onclick="lireTout()">▶️ Lire TOUT</button>
<button onclick="arreterLecture()" style="background:orange">Stop</button>
<br>Vitesse: <input type="range" id="vitesse" min="0.3" max="1.5" step="0.1" value="0.8">
</div>

<script>
// SAUVEGARDE
let questions = JSON.parse(localStorage.getItem('amatechia_questions') || '[]');
function sauvegarder(){localStorage.setItem('amatechia_questions', JSON.stringify(questions));}
function ajouterQuestion(){
  let t=document.getElementById('questionInput').value.trim();
  if(!t) return alert('Écris une question !');
  questions.push({id:Date.now(),texte:t,date:new Date().toLocaleString()});
  sauvegarder(); document.getElementById('questionInput').value=''; afficherQuestions();
}
function effacerTout(){if(confirm('Effacer tout ?')){questions=[]; sauvegarder(); afficherQuestions();}}
function supprimerQuestion(id){questions=questions.filter(q=>q.id!==id); sauvegarder(); afficherQuestions();}
function afficherQuestions(){
  document.getElementById('count').textContent=questions.length;
  let liste=document.getElementById('listeQuestions');
  if(questions.length==0){liste.innerHTML='<p style="color:gray">Aucune question</p>';return;}
  liste.innerHTML=questions.map(q=>`
    <div style="border-bottom:1px solid #eee;padding:8px 0;display:flex;justify-content:space-between">
      <div><b>${q.texte}</b><br><small>${q.date}</small></div>
      <div>
        <button onclick="lireTexte('${q.texte.replace(/'/g,"\\'")}')" style="background:green">🔊</button>
        <button onclick="supprimerQuestion(${q.id})" style="background:red">X</button>
      </div>
    </div>`).join('');
}

// LECTURE SANS COUPURE
let synth=window.speechSynthesis; let queue=[]; let enLecture=false;
function arreterLecture(){synth.cancel(); enLecture=false; queue=[];}
function lireTexte(txt){document.getElementById('texteALire').value=txt; lireTout();}
function lireTout(){
  arreterLecture();
  let texte=document.getElementById('texteALire').value.trim();
  if(!texte) return alert('Écris un texte !');
  let phrases=texte.split(/(?<=[.!?])\s+/);
  if(phrases.length==1) phrases=texte.match(/.{1,80}(?:\s|$)/g)||[texte];
  queue=phrases.filter(p=>p.trim().length>0); enLecture=true;
  let vitesse=parseFloat(document.getElementById('vitesse').value);
  lireProchaine(vitesse);
}
function lireProchaine(vitesse){
  if(queue.length==0||!enLecture){enLecture=false;return;}
  let utterance=new SpeechSynthesisUtterance(queue.shift());
  utterance.lang='fr-FR'; utterance.rate=vitesse;
  utterance.onend=()=>setTimeout(()=>lireProchaine(vitesse),300);
  synth.speak(utterance);
}
afficherQuestions();
</script>
</body>
</html>
