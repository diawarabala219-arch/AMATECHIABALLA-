<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMATECHIA V39 FAST - Balla Moussa Diawara</title>
<style>
body{margin:0;background:#212121;color:#fff;font-family:system-ui}
.top{background:#111;padding:12px;text-align:center;border-bottom:2px solid #facc15;position:sticky;top:0;z-index:10}
.slogan{color:#facc15;font-weight:bold}
.main{max-width:700px;margin:0 auto;padding:16px 16px 90px}
.card{background:#2f2f2f;border:1px solid #444;border-radius:12px;padding:12px;margin:6px;text-align:center;cursor:pointer}
.msg{display:flex;gap:10px;margin:10px 0;padding:12px;background:#2a2a2a;border-radius:10px}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;flex-shrink:0}
.user .avatar{background:#facc15;color:#000}.ai .avatar{background:#10a37f;color:#fff}
.content{flex:1;white-space:pre-wrap;line-height:1.5;font-size:14px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;padding:10px;border-top:1px solid #333}
.box{max-width:700px;margin:0 auto;display:flex;gap:8px;background:#2f2f2f;border-radius:20px;padding:6px 10px}
.box textarea{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:16px;resize:none;height:22px}
.box button{width:36px;height:36px;border-radius:50%;border:none;background:#fff;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="top">
<b>AMATECHIA V39 FAST</b><div class="slogan">☪️ Allah est le tout puissant ☪️</div>
<div style="font-size:11px;opacity:.7">Créée par Balla Moussa Diawara - Développeur - Réponse en 0.1s</div>
</div>
<div class="main">
<div id="welcome" style="text-align:center">
<h2>Rapide comme l'éclair ⚡</h2>
<p style="color:#facc15;font-weight:bold">Allah est le tout puissant</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<div class="card" onclick="ask('Qui est ton créateur ?')">Créateur ?</div>
<div class="card" onclick="ask('Qu est ce que la chimie')">Chimie</div>
<div class="card" onclick="ask('Explique la photosynthèse')">Biologie</div>
<div class="card" onclick="ask('C est quoi une dérivée')">Maths</div>
</div>
</div>
<div id="chat"></div>
</div>
<div class="bottom">
<div class="box">
<textarea id="q" placeholder="Demander à AMATECHIA..."></textarea>
<button onclick="send()">↑</button>
</div>
</div>
<script>
const PARCOURS="Balla Moussa Diawara né le 10/09/2006 à Matoto, élève de la 12e Science Expérimentale au lycée Timbo de Sanoyah, fils de Abdourahmane et de Fadima Diawara. Il créa AMATECHIA à 19 ans depuis son téléphone à 0 FG. Jeune visionnaire guinéen km36 Sanoyah. Développeur de l'appli.";
const SLOGAN="Allah est le tout puissant";
const IDENTITY="Je suis AMATECHIA V39, créée et développée par Balla Moussa Diawara, développeur de l'appli. Je ne suis PAS OpenAI, PAS Meta, PAS ChatGPT.";
const chat=document.getElementById('chat'),welcome=document.getElementById('welcome'),q=document.getElementById('q');
function add(role,text){let d=document.createElement('div');d.className='msg '+role;let c=document.createElement('div');c.className='content';c.textContent=text;let av=document.createElement('div');av.className='avatar';av.textContent=role=='user'?'B':'A';d.appendChild(av);d.appendChild(c);chat.appendChild(d);window.scrollTo(0,999999);return c;}
function ask(t){q.value=t;send();}

function fastAnswer(question){
 let l=question.toLowerCase().trim();
 // IDENTITÉ - INSTANTANÉ
 if(l.includes('slogan')) return "Mon slogan officiel est : "+SLOGAN+" ☪️";
 if(l.includes('qui')&&(l.includes('créé')||l.includes('createur')||l.includes('t\'as')||l.includes('t as')||l.includes('balla')||l.includes('developpeur')||l.includes('qui es tu'))) return IDENTITY+"\n\n"+PARCOURS+"\n\nSlogan : "+SLOGAN;
 if(l.includes('ton but')||l.includes('ton role')||l.includes('objectif')) return IDENTITY+"\n\nMon but : aider les élèves guinéens, expliquer les cours de 12e, idées business 0 FG, répondre vite à tout. "+SLOGAN;
 // COURS 12e - INSTANTANÉ
 if(l.includes('chimie')) return "🔬 CHIMIE : science de la matière et ses transformations.\n• Organique : alcanes CnH2n+2, alcènes, alcools R-OH, acides R-COOH\n• Minérale : acide-base, pH=-log[H+], oxydoréduction\n• Ex: combustion CH4+2O2→CO2+2H2O\n"+SLOGAN+" | "+PARCOURS.split('.')[0];
 if(l.includes('physique')) return "⚡ PHYSIQUE 12e : Mécanique F=m*a, Énergie Ec=½mv², Électricité U=R*I, Ondes. Je t'explique tout en détail.";
 if(l.includes('biologie')||l.includes('bio')||l.includes('photosynthèse')||l.includes('adn')||l.includes('cellule')) return "🧬 BIOLOGIE : Cellule, ADN, photosynthèse 6CO2+6H2O→C6H12O6+6O2, génétique, système immunitaire. Pose ta question précise !";
 if(l.includes('math')||l.includes('dérivée')||l.includes('intégrale')||l.includes('fonction')||l.includes('limite')) return "📐 MATHS 12e : Dérivée f'(x)=lim h→0 [f(x+h)-f(x)]/h, primitives, probas, suites. Exemple: dérivée de x² = 2x. Demande un exercice !";
 if(l.includes('histoire')||l.includes('géo')) return "🌍 HISTOIRE-GÉO : Je peux expliquer colonisation, indépendance Guinée 1958, Sékou Touré, etc.";
 if(l.includes('anglais')||l.includes('français')||l.includes('philo')) return "📚 Littérature : Je t'aide en dissertation, commentaire, traduction. Donne ton sujet !";
 if(l.includes('business')||l.includes('argent')||l.includes('0 fg')) return "💰 BUSINESS 0 FG : 1) Vendre affiches à Sanoyah 2) Cours à domicile 3) Création CV sur téléphone. Commence avec 0 FG comme moi !";
 // RÉPONSE GÉNÉRIQUE RAPIDE POUR TOUT LE RESTE - PLUS DE "En cours..."
 return "⚡ AMATECHIA V39 : "+question+"\n\n→ Réponse : En tant qu'IA créée par Balla Moussa Diawara (12e Science Expérimentale, Timbo), je peux t'expliquer ça clairement. \n\n"+getDetail(question)+"\n\nSlogan : "+SLOGAN;
}
function getDetail(q){
 let l=q.toLowerCase();
 if(l.length<5) return "Pose ta question complète et je réponds instantanément !";
 return "Voici l'essentiel : "+q+" est un sujet important en 12e Science Expérimentale. Je l'explique simplement, avec exemples et formules si besoin. Si tu veux plus de détails, précise ton niveau ou donne un exercice.";
}

function send(){
 let t=q.value.trim();if(!t) return;
 if(welcome) welcome.style.display='none';
 q.value=''; add('user',t);
 // RÉPONSE IMMÉDIATE 0.1s
 let ans=fastAnswer(t);
 add('ai',ans);
 // Optionnel : amélioration en arrière-plan si internet
 if(ans.startsWith("⚡ AMATECHIA V39 :")){
   fetch("https://text.pollinations.ai/"+encodeURIComponent("Tu es AMATECHIA V39 créée par Balla Moussa Diawara développeur appli, slogan Allah est le tout puissant, PAS OpenAI/Meta. Réponds court en français à: "+t)).then(r=>r.text()).then(txt=>{
     if(txt && txt.length>10 && !txt.toLowerCase().includes("openai") && !txt.toLowerCase().includes("meta")){
       // On remplace le dernier message par meilleure réponse
       let last = chat.lastChild.querySelector('.content');
       if(last) last.textContent = txt + "\n\nSlogan : "+SLOGAN+" | Créée par Balla Moussa Diawara";
     }
   }).catch(()=>{});
 }
}
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
</script>
</body>
</html>
