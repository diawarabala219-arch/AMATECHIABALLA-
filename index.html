<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
<title>AMATECHIA V34 - Balla Moussa Diawara</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#212121;color:#ececec;font-family:system-ui;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.top{background:#171717;padding:10px;text-align:center;border-bottom:2px solid #facc15;position:sticky;top:0;z-index:10}
.slogan{color:#facc15;font-weight:700;font-size:12px}
.center{flex:1;padding:20px 16px 100px;max-width:720px;margin:0 auto;width:100%}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.card{background:#2f2f2f;border:1px solid #444;border-radius:12px;padding:14px;cursor:pointer;text-align:center;font-weight:600}
.card:active{background:#3a3a3a}
.msg{padding:14px 0;display:flex;gap:10px;border-bottom:1px solid #2f2f2f;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}
.avatar.user{background:#facc15;color:#000}.avatar.ai{background:#10a37f;color:#fff}
.content{flex:1;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#171717;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid #333;z-index:20}
.input-box{max-width:720px;margin:0 auto;background:#2f2f2f;border-radius:24px;border:1px solid #555;display:flex;align-items:center;padding:4px 6px 4px 16px}
.input-box textarea{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px;resize:none;height:24px;max-height:100px;padding:4px 0}
.send{width:36px;height:36px;border-radius:50%;border:none;background:#fff;color:#000;font-weight:900;font-size:18px;cursor:pointer;flex-shrink:0}
.send:active{transform:scale(.9)}
</style>
</head>
<body>
<div class="top">
<b>AMATECHIA V34</b><div class="slogan">
