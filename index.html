<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AMATECHIA - ChatGPT by Balla</title>
<link rel="manifest" href="manifest.json">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#212121;color:#ececec;display:flex;height:100vh}
.sidebar{width:260px;background:#171717;display:flex;flex-direction:column;padding:12px;transition:0.3s}
.main{flex:1;display:flex;flex-direction:column;background:#212121;position:relative}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #2f2f2f}
.logo{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.chat{flex:1;overflow-y:auto;padding-bottom:120px}
.msg-row{padding:24px 0;border-bottom:1px solid #2f2f2f1a}
.msg-inner{max-width:768px;margin:0 auto;display:flex;gap:16px;padding:0 24px}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
.avatar.user{background:#facc15;color:black}
.avatar.ai{background:#171717;border:1px solid #3f3f3f}
.bubble{flex:1;line-height:1.7;white-space:pre-wrap;font-size:15px}
.bubble.user{font-weight:500}
.input-wrap{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,#212121 40%)
