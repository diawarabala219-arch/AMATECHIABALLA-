<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMATECHIA V25 - Entrepreneur Visionnaire</title>
<style>
body{margin:0;background:#212121;color:#ececec;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
.top{background:#171717;padding:12px;text-align:center;border-bottom:2px solid #facc15}
.center{flex:1;overflow-y:auto;padding:20px 16px 120px;max-width:720px;margin:0 auto;width:100%}
.welcome{text-align:center;margin-top:20px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.card{background:#2f2f2f;border:1px solid #444;border-radius:12px;padding:12px;cursor:pointer}
.chat{display:none;flex-direction:column}.chat.show{display:flex}
.msg{padding:14px 0;display:flex;gap:10px;border-bottom:1px solid #2f2f2f}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}
.avatar.user{background:#facc15;color:#000}.avatar.ai{background:#10a37f;color:#fff}
.content{flex:1;font-size:14px;line-height:1.6;white-space:pre-wrap}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#212121;padding:12px 16px;border-top:1px solid #333}
.input-box{max-width:720px;margin:0 auto;background:#2f2f2f;border-radius:24px;border:1px solid #444;padding:8px 12px;display:flex;gap:8px;align-items:center}
.input-box textarea{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:14px;resize:none}
.send{background:#fff;color:#000;border:none;width:32px;height:32px;border-radius:50%;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="top"><b>🚀 AMATECHIA V25 - Entrepreneur Visionnaire - 0 GNF</b></div>
<div class="center" id="center">
<div class="welcome" id="welcome">
<h2>Comment puis-je t'aider, visionnaire ?</h2>
<p style="color:#8e8ea0;font-size:13px">Comme ChatGPT & Meta AI, mais pour entrepreneurs</p>
<div class="cards">
<div class="card" onclick="ask('Qui est tu ?')"><b>👋 Qui est tu ?</b></div>
<div class="card" onclick="ask('Donne moi une idée business rentable à Conakry avec 0 GNF')"><b>💡 Idée Business 0 GNF</b></div>
<div class="card" onclick="ask('Quand as tu été créée ?')"><b>📅 Histoire</b></div>
<div class="card" onclick="ask('Comment devenir entrepreneur visionnaire comme Balla ?')"><b>🚀 Vision</b></div>
</div>
</div>
<div class="chat" id="chat"></div>
</div>
<div class="bottom"><div class="input-box"><textarea id="q" rows="1" placeholder="Demande à AMATECHIA..."></textarea><button class="send" onclick="send()">↑</button></div></div>
<script>
const SYSTEM_PROMPT = `Tu es AMATECHIA V25, l'IA de Balla Diawara, 19 ans, Entrepreneur Visionnaire à Kagbelen, Conakry, Guinée. Créée en Octobre 2026 à Kagbelen. Tu es comme ChatGPT et Meta AI mais ton style est entrepreneur visionnaire : tu aides à créer des business, trouver des idées, motiver, conseiller stratégie, marketing, mindset. Tu réponds à TOUT comme ChatGPT mais avec une mentalité d'entrepreneur qui voit grand. Tu es amical, tu dis "gho" parfois, tu es inspirant. Tu parles français. Gratuite 0 GNF.`;
var q=document.getElementById('q'),chat=document.getElementById('chat'),welcome=document.getElementById('welcome'),center=document.getElementById('center');
function addMsg(role, html){var d=document.createElement('div');d.className='msg '+role;d.innerHTML='<div class="avatar '+role+'">'+(role==='user'?'B':'A')+'</div><div class="content">'+html+'</div>';chat.appendChild(d);center.scrollTop=999999;return d;}
function hideWelcome(){welcome.style.display='none';chat.classList.add('show');}
function ask(t){q.value=t;send();}
async function askAI(question){
  const system = encodeURIComponent(SYSTEM_PROMPT);
  const qq = encodeURIComponent(question);
  try{
    let res = await fetch(`https://text.pollinations.ai/${qq}?system=${system}`);
    if(res.status===402) return "⏳ Attends 30s gho, limite gratuite. Réessaie !";
    return await res.text();
  }catch(e){return "Réseau faible gho, mais je suis AMATECHIA V25 de Balla, Entrepreneur Visionnaire. Repose ta question !";}
}
async function send(){
  var t=q.value.trim();if(!t) return;
  if(welcome.style.display!='none') hideWelcome();
  q.value='';addMsg('user',t);
  var thinking = addMsg('ai','⏳ AMATECHIA réfléchit comme un visionnaire...');
  thinking.querySelector('.content').textContent = await askAI(t);
  center.scrollTop=999999;
}
</script>
</body>
</html>
