<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfriConnect</title>
    <!-- Chargement de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h1>Bienvenue sur AfriConnect</h1>

    <!-- Formulaire de publication simple -->
    <div style="margin: 20px 0;">
        <input type="text" id="auteurInput" placeholder="Votre nom (ex: Balla Moussa Diawara)" style="padding: 8px; width: 300px;"><br><br>
        <textarea id="contenuInput" placeholder="Quoi de neuf ?" style="padding: 8px; width: 300px; height: 80px;"></textarea><br>
        <button onclick="publier()" style="padding: 10px 20px; background: #1877f2; color: white; border: none; border-radius: 5px; cursor: pointer;">Publier</button>
    </div>

    <!-- Fil d'actualité -->
    <h3>Fil d'actualité</h3>
    <div id="filActualite">Chargement des publications...</div>

    <!-- Script de configuration et de gestion Supabase -->
    <script>
        // Remplacez ces valeurs par vos vraies clés prises sur votre tableau de bord Supabase
        const SUPABASE_URL = 'VOTRE_URL_SUPABASE';
        const SUPABASE_ANON_KEY = 'VOTRE_CLE_ANON';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 1. Charger les publications au démarrage
        async function chargerPosts() {
            const { data: posts, error } = await supabase
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            const filDiv = document.getElementById('filActualite');
            
            if (error) {
                filDiv.innerHTML = "Erreur de chargement des publications.";
                console.error(error);
                return;
            }

            if (posts.length === 0) {
                filDiv.innerHTML = "Aucune publication pour le moment.";
                return;
            }

            // Afficher chaque publication dans le HTML
            filDiv.innerHTML = "";
            posts.forEach(post => {
                filDiv.innerHTML += `
                    <div style="background: #f0f2f5; padding: 15px; margin: 10px 0; border-radius: 8px; max-width: 400px;">
                        <strong>${post.auteur}</strong>
                        <p>${post.contenu}</p>
                        <small style="color: gray;">${new Date(post.created_at).toLocaleString()}</small>
                    </div>
                `;
            });
        }

        // 2. Envoyer une publication vers Supabase
        async function publier() {
            const auteur = document.getElementById('auteurInput').value;
            const contenu = document.getElementById('contenuInput').value;

            if (!auteur || !contenu) {
                alert("Veuillez remplir votre nom et votre message !");
                return;
            }

            const { error } = await supabase
                .from('posts')
                .insert([{ auteur: auteur, contenu: contenu }]);

            if (error) {
                alert("Erreur lors de la publication : " + error.message);
            } else {
                document.getElementById('contenuInput').value = ""; // Vider le champ
                chargerPosts(); // Recharger le fil en direct
            }
        }

        // Lancer le chargement dès l'ouverture de la page
        chargerPosts();
    </script>
</body>
</html>
