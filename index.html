<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMATECHIA V30 - Balla Moussa Diawara</title>
<style>
body{margin:0;background:#212121;color:#ececec;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
.top{background:#171717;padding:12px;text-align:center;border-bottom:2px solid #facc15}
.center{flex:1;overflow-y:auto;padding:20px 16px 120px;max-width:720px;margin:0 auto;width:100%}
.welcome{text-align:center;margin-top:10px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.card{background:#2f2f2f;border:1px solid #444;border-radius:12px;padding:12px;cursor:pointer}
.msg{padding:14px 0;display:flex;gap:10px;border-bottom:1px solid #2f2f2f}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}
.avatar.user{background:#facc15;color:#000}.avatar.ai{background:#10a37f;color:#fff}
.content{flex:1;font-size:14px;line-height:1.6;white-space:pre-wrap}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#212121;padding:12px 16px;border-top:1px solid #333}
.input-box{max-width:720px;margin:0 auto;background:#2f2f2f;border-radius:24px;border:1px solid #444;padding:8px 12px;display:flex;gap:8px;align-items:center}
.input-box textarea{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:14px;resize:none}
.send{background:#fff;color:#000;border:none;width:32px;height:32px;border-radius:50%;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="top"><b>AMATECHIA V30</b><br><small>Par Balla Moussa Diawara - 12e Science Expérimentale</small></div>
<div class="center" id="center">
<div class="welcome" id="welcome">
<h2>Comment puis-je vous aider ?</h2>
<p style="color:#8e8ea0;font-size:12px">Créée par Balla Moussa Diawara - 12e Science Expérimentale</p>
<div class="cards">
<div class="card" onclick="ask('Qui est ton créateur ? Donne son parcours complet')"><b>Qui est Balla Moussa ?</b></div>
<div class="card" onclick="ask('Quand as tu été créée ?')"><b>Histoire AMATECHIA</b></div>
<div class="card" onclick="ask('Donne moi une idée business à 0 FG')"><b>Business 0 FG</b></div>
<div class="card" onclick="ask('Que sais-tu faire ?')"><b>Capacités</b></div>
</div>
</div>
<div class="chat" id="chat"></div>
</div>
<div class="bottom"><div class="input-box"><textarea id="q" rows="1" placeholder="Demander à AMATECHIA..."></textarea><button class="send" onclick="send()">↑</button></div></div>
<script>
const SYSTEM_PROMPT = `Tu es AMATECHIA V30, créée par Balla Moussa Diawara.

PARCOURS OFFICIEL DE BALLA MOUSSA DIAWARA - À CITER EXACTEMENT :
"Balla Moussa Diawara né le 10/09/2006 à Matoto, élève de la 12e Science Expérimentale au lycée Timbo de Sanoyah, fils de Abdourahmane et de Fadima Diawara. Il créa AMATECHIA à l'âge de 19 ans après plusieurs nuits blanches d'échec depuis son téléphone à seulement zéro FG. Jeune visionnaire guinéen de km36 à Sanoyah."

RÈGLES :
- Cite ce parcours exactement quand on le demande.
- Ne dis jamais le mot "gho".
- Réponds comme ChatGPT et Meta AI, pro et clair.
- Gratuite 0 FG. Créée Octobre 2026.`;

var q=document.getElementById('q'),chat=document.getElementById('chat'),welcome=document.getElementById('welcome'),center=document.getElementById('center');
function addMsg(role, html){var d=document.createElement('div');d.className='msg '+role;d.innerHTML='<div class="avatar '+role+'">'+(role==='user'?'B':'A')+'</div><div class="content">'+html+'</div>';chat.appendChild(d);center.scrollTop=999999;return d;}
function hideWelcome(){welcome.style.display='none';chat.classList.add('show');}
function ask(t){q.value=t;send();}
async function askAI(question){
  try{let res=await fetch(`https://text.pollinations.ai/${encodeURIComponent(question)}?system=${encodeURIComponent(SYSTEM_PROMPT)}`);return await res.text();}catch(e){return "Je suis AMATECHIA V30 créée par Balla Moussa Diawara né le 10/09/2006 à Matoto, élève de la 12e Science Expérimentale au lycée Timbo de Sanoyah, fils de Abdourahmane et de Fadima Diawara. Il créa AMATECHIA à 19 ans après plusieurs nuits blanches d'échec depuis son téléphone à zéro FG. Jeune visionnaire guinéen de km36 à Sanoyah.";}
}
async function send(){
  var t=q.value.trim();if(!t) return;
  if(welcome.style.display!='none') hideWelcome();
  q.value='';addMsg('user',t);
  var th=addMsg('ai','En cours...');
  th.querySelector('.content').textContent=await askAI(t);
  center.scrollTop=999999;
}
</script>
</body>
</html>
