<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMATECHIA V35 - Balla Moussa Diawara</title>
<style>
body{margin:0;background:#212121;color:#fff;font-family:system-ui}
.top{background:#111;padding:12px;text-align:center;border-bottom:2px solid #facc15;position:sticky;top:0}
.slogan{color:#facc15;font-weight:bold;font-size:13px}
.main{max-width:700px;margin:0 auto;padding:20px 16px 90px}
.card{background:#2f2f2f;border:1px solid #444;border-radius:12px;padding:14px;margin:8px 0;cursor:pointer;text-align:center}
.msg{background:#2f2f2f;margin:10px 0;padding:12px;border-radius:10px;display:flex;gap:10px}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;flex-shrink:0}
.user .avatar{background:#facc15;color:#000}.ai .avatar{background:#10a37f;color:#fff}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;padding:10px;border-top:1px solid #333}
.box{max-width:700px;margin:0 auto;display:flex;gap:8px;background:#2f2f2f;border-radius:20px;padding:6px 10px}
.box textarea{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:16px;resize:none;height:22px}
.box button{width:34px;height:34px;border-radius:50%;border:none;background:#fff;font-weight:900}
</style>
</head>
<body>
<div class="top">
<div><b>AMATECHIA V35</b></div>
<div class="slogan">☪️ Allah est le tout puissant ☪️</div>
<div style="font-size:11px;opacity:.7">Par Balla Moussa Diawara - 12e Science Expérimentale</div>
</div>
<div class="main" id="main">
<div id="welcome" style="text-align:center">
<h2>Comment puis-je vous aider ?</h2>
<p style="color:#facc15;font-weight:bold">Allah est le tout puissant</p>
<p style="font-size:12px;color:#888">Créée par Balla Moussa Diawara</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px">
<div class="card" onclick="ask('Qui est Balla Moussa Diawara')">Qui est Balla Moussa ?</div>
<div class="card" onclick="ask('slogan')">☪️ Slogan</div>
<div class="card" onclick="ask('business 0 FG')">Business 0 FG</div>
<div class="card" onclick="ask('capacités')">Capacités</div>
</div>
</div>
<div id="chat"></div>
</div>
<div class="bottom">
<div class="box">
<textarea id="q" placeholder="Demander à AMATECHIA..."></textarea>
<button onclick="send()">↑</button>
</div>
</div>
<script>
const PARCOURS="Balla Moussa Diawara né le 10/09/2006 à Matoto, élève de la 12e Science Expérimentale au lycée Timbo de Sanoyah, fils de Abdourahmane et de Fadima Diawara. Il créa AMATECHIA à l'âge de 19 ans après plusieurs nuits blanches d'échec depuis son téléphone à seulement zéro FG. Jeune visionnaire guinéen de km36 à Sanoyah.";
const SLOGAN="Allah est le tout puissant";
const main=document.getElementById('main'),chat=document.getElementById('chat'),welcome=document.getElementById('welcome'),q=document.getElementById('q');
function add(role,text){let d=document.createElement('div');d.className='msg '+role;d.innerHTML='<div class="avatar">'+(role=='user'?'B':'A')+'</div><div>'+text+'</div>';chat.appendChild(d);window.scrollTo(0,999999);return d}
function ask(t){q.value=t;send()}
function getAns(t){
 let l=t.toLowerCase();
 if(l.includes('slogan')) return "Mon slogan officiel est : "+SLOGAN+" ☪️";
 if(l.includes('qui')||l.includes('balla')||l.includes('parcours')||l.includes('createur')) return PARCOURS+"\n\nSlogan : "+SLOGAN;
 if(l.includes('salut')||l.includes('bonjour')) return "Salut ! Je suis AMATECHIA V35. "+SLOGAN+" . Créée par Balla Moussa Diawara. Comment t'aider ?";
 if(l.includes('business')) return "Idée 0 FG : Vendre des affiches 'Allah est le tout puissant' à Sanoyah km36 avec ton téléphone. 0 FG au départ.";
 return "Je suis AMATECHIA V35 créée par "+PARCOURS+" Mon slogan : "+SLOGAN+" . Pose-moi ta question !";
}
function send(){
 let t=q.value.trim();if(!t) return;
 if(welcome) welcome.style.display='none';
 q.value=''; add('user',t);
 let b=add('ai','...'); 
 setTimeout(()=>{b.innerHTML='<div class="avatar">A</div><div>'+getAns(t)+'</div>';window.scrollTo(0,999999);},300);
}
q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});
</script>
</body>
</html>
