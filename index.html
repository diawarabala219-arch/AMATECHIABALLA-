<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMATECHIA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f5f5f5;padding:10px}
.header{background:#1a73e8;color:white;padding:20px;text-align:center;border-radius:12px}
.card{background:white;padding:15px;border-radius:12px;margin-top:12px;box-shadow:0 2px 5px #ccc}
input,textarea{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font-size:16px}
button{border:none;padding:12px 20px;border-radius:10px;color:white;font-weight:bold;cursor:pointer;font-size:16px}
.btn-blue{background:#1a73e8} .btn-green{background:#34a853;width:100%;margin-top:10px;font-size:18px} .btn-red{background:#ea4335}
.msg{padding:12px;border-radius:12px;margin:8px 0}
.user{background:#e3f2fd;text-align:right}
.ai{background:#f1f1f1}
</style>
</head>
<body>

<div class="header">
<h2>AMATECHIA 🇬🇳</h2>
<p>Pose une question - Je réponds et je lis</p>
</div>

<div class="card">
<input id="q" placeholder="Ex: C'est quoi l'informatique ?" onkeydown="if(event.key==='Enter') poser()">
<button class="btn-blue" onclick="poser()" style="margin-top:10px;width:100%">Envoyer</button>
</div>

<div class="card" id="chat"></div>

<div class="card">
<h3>🔊 Voix</h3>
<p id="etat">Prête</p>
<button class="btn-green" onclick="stopVoix()">⏹️ STOP VOIX</button>
<label style="display:block;margin-top:10px">Vitesse: <input type="range" id="vit" min="0.5" max="1.2" step="0.1" value="0.85" style="width:80px" oninput="document.getElementById('vtxt').textContent=this.value"> <span id="vtxt">0.85</span></label>
</div>

<script>
let QUESTIONS = JSON.parse(localStorage.getItem('amatechia_simple_v4')||'[]');
let synth = window.speechSynthesis;
let enCours = false;

function save(){localStorage.setItem('amatechia_simple_v4', JSON.stringify(QUESTIONS));}
function stopVoix(){synth.cancel(); enCours=false; document.getElementById('etat').textContent='Arrêtée';}

function poser(){
 let t = document.getElementById('q').value.trim();
 if(!t) return;
 document.getElementById('q').value='';
 QUESTIONS.unshift({q:t, r:reponsePour(t), date:new Date().toLocaleString()});
 save(); afficher();
 // LIT AUTOMATIQUEMENT
 setTimeout(()=> lireAuto(QUESTIONS[0].r), 300);
}

function reponsePour(question){
 return `Salut ! Tu as demandé : ${question}. Je suis AMATECHIA, ton assistant. Voici une réponse simple et complète. L'informatique c'est l'étude des ordinateurs et de comment ils traitent l'information. Si tu veux plus d'infos, repose une autre question.`;
}

function afficher(){
 let div = document.getElementById('chat');
 if(QUESTIONS.length==0){div.innerHTML='<p style="color:#999;text-align:center">Aucune question encore</p>'; return;}
 div.innerHTML = QUESTIONS.map((x,i)=>`
  <div class="msg user"><b>Toi:</b> ${x.q} <br><small>${x.date}</small></div>
  <div class="msg ai"><b>AMATECHIA:</b> ${x.r} <br><button class="btn-blue" style="padding:6px 12px;margin-top:8px" onclick="lireAuto(\`${x.r.replace(/`/g,'').replace(/'/g,"\\'")}\`)">🔊 Réécouter</button> <button class="btn-red" style="padding:6px" onclick="suppr(${i})">X</button></div>
 `).join('');
}
function suppr(i){QUESTIONS.splice(i,1); save(); afficher(); stopVoix();}

function lireAuto(longTexte){
 stopVoix();
 enCours=true;
 document.getElementById('etat').textContent='Je lis...';
 // Coupe en petits bouts de 80 lettres pour ne jamais couper
 let phrases = longTexte.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [longTexte];
 let file=[];
 phrases.forEach(p=>{
   if(p.length>80){ file.push(...(p.match(/.{1,70}(\s|$)/g)||[p])); }
   else file.push(p);
 });
 file=file.filter(s=>s.trim().length>2);
 
 function litSuivant(){
   if(file.length==0 || !enCours){document.getElementById('etat').textContent='Terminé ✅'; enCours=false; return;}
   let u = new SpeechSynthesisUtterance(file.shift());
   u.lang='fr-FR';
   u.rate=parseFloat(document.getElementById('vit').value);
   u.onend=()=>setTimeout(litSuivant, 150);
   synth.speak(u);
 }
 litSuivant();
}

// Important pour Android: charger les voix
synth.onvoiceschanged=()=>{synth.getVoices();};

afficher();
</script>
</body>
</html>
