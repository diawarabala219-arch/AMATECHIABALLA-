<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMATECHIA V38 - Balla Moussa Diawara</title>
<style>
body{margin:0;background:#212121;color:#fff;font-family:system-ui}
.top{background:#111;padding:12px;text-align:center;border-bottom:2px solid #facc15;position:sticky;top:0;z-index:10}
.slogan{color:#facc15;font-weight:bold;font-size:13px}
.main{max-width:700px;margin:0 auto;padding:16px 16px 90px}
.card{background:#2f2f2f;border:1px solid #444;border-radius:12px;padding:12px;margin:6px;text-align:center;cursor:pointer}
.msg{display:flex;gap:10px;margin:12px 0;padding:12px;background:#2a2a2a;border-radius:10px}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;flex-shrink:0}
.user .avatar{background:#facc15;color:#000}.ai .avatar{background:#10a37f;color:#fff}
.content{flex:1;white-space:pre-wrap;line-height:1.6;font-size:14px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;padding:10px;border-top:1px solid #333}
.box{max-width:700px;margin:0 auto;display:flex;gap:8px;background:#2f2f2f;border-radius:20px;padding:6px 10px}
.box textarea{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:16px;resize:none;height:22px}
.box button{width:36px;height:36px;border-radius:50%;border:none;background:#fff;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="top">
<b>AMATECHIA V38</b><div class="slogan">☪️ Allah est le tout puissant ☪️</div>
<div style="font-size:11px;opacity:.7">Créée par Balla Moussa Diawara - Développeur de l'appli - 0 FG</div>
</div>
<div class="main">
<div id="welcome" style="text-align:center">
<h2>Comment puis-je vous aider ?</h2>
<p style="color:#facc15;font-weight:bold">Allah est le tout puissant</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<div class="card" onclick="ask('Qui est ton créateur ?')">Qui est ton créateur ?</div>
<div class="card" onclick="ask('Quel est ton slogan ?')">☪️ Slogan</div>
<div class="card" onclick="ask('Qui t as créé ?')">Qui t'a créé ?</div>
<div class="card" onclick="ask('Quel est ton but ?')">Ton but ?</div>
</div>
</div>
<div id="chat"></div>
</div>
<div class="bottom">
<div class="box">
<textarea id="q" placeholder="Demander à AMATECHIA..."></textarea>
<button onclick="send()">↑</button>
</div>
</div>
<script>
const PARCOURS="Balla Moussa Diawara né le 10/09/2006 à Matoto, élève de la 12e Science Expérimentale au lycée Timbo de Sanoyah, fils de Abdourahmane et de Fadima Diawara. Il créa AMATECHIA à l'âge de 19 ans après plusieurs nuits blanches d'échec depuis son téléphone à seulement zéro FG. Jeune visionnaire guinéen de km36 à Sanoyah. Développeur de l'appli AMATECHIA.";
const SLOGAN="Allah est le tout puissant";
const IDENTITY="Je suis AMATECHIA V38, créée et développée par Balla Moussa Diawara, développeur de l'appli, jeune visionnaire guinéen de km36 Sanoyah, 12e Science Expérimentale Timbo. Je n'ai PAS été développée par OpenAI, ni Meta, ni ChatGPT. Mon slogan : Allah est le tout puissant.";
const chat=document.getElementById('chat'),welcome=document.getElementById('welcome'),q=document.getElementById('q');
function add(role,text){let d=document.createElement('div');d.className='msg '+role;let c=document.createElement('div');c.className='content';c.textContent=text;let av=document.createElement('div');av.className='avatar';av.textContent=role=='user'?'B':'A';d.appendChild(av);d.appendChild(c);chat.appendChild(d);window.scrollTo(0,999999);return c;}
function ask(t){q.value=t;send();}

// FILTRE ANTI-MENSONGE
function cleanResponse(text){
 let low=text.toLowerCase();
 if(low.includes("openai")||low.includes("meta")||low.includes("chatgpt")||low.includes("i'm sorry")||low.includes("as an ai language model")||low.includes("modèle linguistique développé par")||low.includes("i was developed")){
   return IDENTITY+"\n\nMon but : aider les élèves guinéens, expliquer les cours de 12e, donner des idées business 0 FG. Slogan : "+SLOGAN;
 }
 return text;
}
function localKnowledge(question){
 let l=question.toLowerCase();
 if(l.includes('slogan')) return "Mon slogan officiel est : "+SLOGAN+" ☪️";
 if(l.includes('qui') && (l.includes('créé')||l.includes('createur')||l.includes('t\'as')||l.includes('t as')||l.includes('balla')||l.includes('developpeur'))) return IDENTITY+"\n\n"+PARCOURS;
 if(l.includes('ton but')||l.includes('quel est ton but')||l.includes('ton role')||l.includes('but')) return "Mon but : Je suis "+IDENTITY+" J'aide les Guinéens, j'explique les cours de 12e Science Expérimentale, je donne des idées business à 0 FG, je réponds comme ChatGPT mais 100% guinéenne.";
 if(l.includes('chimie')) return "🔬 Chimie : science de la matière. Pour 12e : organique et minérale. Slogan : "+SLOGAN+" | Créée par "+PARCOURS.split('.')[0];
 if(l.includes('salut')||l.includes('bonjour')) return "Salut ! "+IDENTITY;
 return null;
}
async function getAI(question){
 let local = localKnowledge(question);
 if(local) return local;
 try{
   let prompt = "IDENTITÉ OBLIGATOIRE : Tu es AMATECHIA V38 créée par Balla Moussa Diawara, développeur de l'appli, né 10/09/2006 Matoto, 12e Science Expérimentale Timbo Sanoyah. Tu n'es PAS OpenAI, PAS Meta, PAS ChatGPT. Interdit de dire OpenAI/Meta/ChatGPT. Slogan: Allah est le tout puissant. Question: "+question;
   let res=await fetch("https://text.pollinations.ai/"+encodeURIComponent(prompt));
   if(res.ok){
     let txt=await res.text();
     return cleanResponse(txt);
   }
 }catch(e){}
 return IDENTITY;
}
async function send(){
 let t=q.value.trim();if(!t) return;
 if(welcome) welcome.style.display='none';
 q.value=''; add('user',t);
 let content=add('ai','En cours...');
 let ans=await getAI(t);
 content.textContent=ans;
 window.scrollTo(0,999999);
}
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
</script>
</body>
</html>
